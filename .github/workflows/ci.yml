name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: "Require type(scope): subject"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun promptus/scripts/check-pr-title.ts "$PR_TITLE"

  test:
    name: test + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Validate marketplace + plugins (manifests + components)
        run: bun promptus/scripts/validate-plugin.ts
      - name: Check Promptus store health
        run: bun promptus/scripts/promptus-check.ts --strict
      - name: Run tests
        run: bun test

  cross-os:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Validate both agent adapters
        run: bun promptus/scripts/validate-plugin.ts
      - name: Run tests
        run: bun test

  lint:
    name: pre-commit (hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
